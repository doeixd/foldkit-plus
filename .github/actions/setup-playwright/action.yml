name: Setup Playwright Chromium
description: Restore the Playwright browser cache and install Chromium with retry on transient apt/network failures.
runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if pnpm exec playwright install --with-deps chromium; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          echo "::warning::playwright install attempt $attempt failed; retrying in 10s"
          sleep 10
        done
