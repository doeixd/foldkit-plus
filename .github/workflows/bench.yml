name: Bench

on:
  schedule:
    # Weekly on Monday, so the numbers have a stable reference over time.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      # The workspace's Vitest config includes the browser project, which
      # launches headless Chromium even when only benchmarks run.
      - uses: ./.github/actions/setup-playwright

      # Prints hz/mean/p99 and the durable bytes-per-operation reading to the
      # job log. Not a gate: shared runners are too noisy to fail a build on a
      # timing regression.
      - run: pnpm bench
      - run: pnpm bench:storage
