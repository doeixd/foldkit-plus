name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes its older run moot; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies what a pull request touched so unrelated heavy jobs skip cleanly.
  # A job-level `if` rather than `paths-ignore`: a check that never runs blocks
  # a merge, a skipped one does not. Pushes to `main` always run every job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      browser: ${{ steps.files.outputs.browser }}
      postgres: ${{ steps.files.outputs.postgres }}
      site: ${{ steps.files.outputs.site }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          browser=true
          postgres=true
          site=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
            # An empty list is a failed read, not an empty change.
            if [ -n "$files" ]; then
              code=false
              browser=false
              postgres=false
              site=false
              while IFS= read -r file; do
                case "$file" in
                  skills/*) code=true ;;
                  *.md | docs/* | LICENSE) site=true ;;
                  *) code=true ;;
                esac
                case "$file" in
                  packages/entity/* | packages/remote-drizzle/* | packages/remote/* | packages/remote-server/* | packages/metakit/* | packages/guard/* | pnpm-lock.yaml | package.json | vitest* | .github/*)
                    postgres=true
                    ;;
                esac
                case "$file" in
                  examples/site/* | docs/* | *.md | packages/* | pnpm-lock.yaml | package.json | .github/*)
                    site=true
                    ;;
                esac
                case "$file" in
                  *.md | docs/* | LICENSE | packages/entity/* | packages/remote-drizzle/* | packages/remote-domain/* | packages/remote-server/* | packages/durable/* | packages/host/* | packages/auth/*)
                    ;;
                  *)
                    browser=true
                    ;;
                esac
              done <<< "$files"
            fi
          fi
          {
            echo "code=$code"
            echo "browser=$browser"
            echo "postgres=$postgres"
            echo "site=$site"
          } >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - run: pnpm format:check

      - run: pnpm paths:check

      - run: pnpm icons:check

      # Every branch on a `_tag` goes through a type the checker holds (AGENTS.md).
      - run: pnpm tags:check

      # No physical left/right in a style without a `// physical:` reason.
      - run: pnpm rtl:check

      # No `ModelRef`/`WritableProjection` write outside the packages that own
      # those seams without a `// write: infrastructure — <why>` reason.
      - run: pnpm writes:check

      # Every mutation spec still finds the code it edits; the mutations
      # themselves are too slow for CI, and a spec that rots runs nothing.
      - run: pnpm mutate:check

  # Incremental `.tsbuild` cache on PRs (invalidated whenever any tsconfig or
  # lockfile changes); forced full rebuild on `main`.
  typecheck:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - if: github.event_name == 'pull_request'
        uses: actions/cache@v5
        with:
          path: |
            packages/*/.tsbuild
            examples/*/.tsbuild
            examples/foldkit/*/.tsbuild
          key: ${{ runner.os }}-tsbuild-${{ hashFiles('tsconfig.json', 'packages/*/tsconfig.json', 'examples/*/tsconfig.json', 'examples/foldkit/*/tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsbuild-${{ hashFiles('tsconfig.json', 'packages/*/tsconfig.json', 'examples/*/tsconfig.json', 'examples/foldkit/*/tsconfig.json', 'pnpm-lock.yaml') }}-

      - if: github.event_name != 'pull_request'
        run: pnpm typecheck:force

      - if: github.event_name == 'pull_request'
        run: pnpm typecheck

      # The docs' TypeScript blocks, against what the step above just built,
      # so it takes seconds rather than a job of its own.
      - run: pnpm docs:check

  # Node/jsdom unit shards: the two unit files that launch Chromium run in
  # `browser (touch)`, so none of these shards need Playwright or apt-get.
  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # The site's link-check tests read a release tag's tree (`githubLinks.test.ts`).
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-workspace

      # `foldkit-domains` is upstream's copy, happy-dom like the rest of these.
      - run: pnpm test --project unit --project foldkit-domains --shard=${{ matrix.shard }}/3

  # Fast unit check for docs-only PRs: runs only the suites that read docs/blog/skill.
  unit-docs:
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-workspace

      - run: pnpm exec vitest run --project unit examples/site/test packages/plus/test

  # What jsdom cannot check: layout, focus, the caret, in headless Chromium.
  # Each shard runs ONE browser project (never `browser` + `browser-touch`
  # together, which opens two Chromium instances in one runner) and stays under
  # ~60 files so Chromium's renderer never hits its ~75-file memory wall
  # (`VITEST_BROWSER_CONNECTION_CLOSED`). The light `touch` shard also runs the
  # two Node unit files that launch Playwright themselves.
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: browser (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 1/6, args: --project browser --shard=1/6, pw_unit: '' }
          - { name: 2/6, args: --project browser --shard=2/6, pw_unit: '' }
          - { name: 3/6, args: --project browser --shard=3/6, pw_unit: '' }
          - { name: 4/6, args: --project browser --shard=4/6, pw_unit: '' }
          - { name: 5/6, args: --project browser --shard=5/6, pw_unit: '' }
          - { name: 6/6, args: --project browser --shard=6/6, pw_unit: '' }
          - { name: touch, args: --project browser-touch, pw_unit: '1' }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/setup-playwright

      # One worker per runner: Chromium sometimes closes its connection mid-run
      # in a different shard each time (#582; cause unknown), and two workers
      # share one machine's memory. A run that fails with that signature alone
      # is run once more and the re-run is written to the job summary; any
      # other failure, an assertion failure included, fails the job at once, and
      # so does a second failure of the same shard. The signature is the error
      # code with no failed test: a failed test prints ` FAIL `, a `Failed
      # Tests` heading and `N failed` in the summary counts, and none of those
      # appears when a file only failed to load.
      - name: Browser tests (one re-run when the browser connection closes)
        env:
          ARGS: ${{ matrix.args }}
          SHARD: ${{ matrix.name }}
        run: |
          set -o pipefail
          first_log="$RUNNER_TEMP/browser-first.log"
          second_log="$RUNNER_TEMP/browser-second.log"

          # pipefail makes the pipeline's status pnpm's, not tee's.
          run_tests() {
            # shellcheck disable=SC2086
            pnpm test $ARGS --maxWorkers=1 2>&1 | tee "$1"
          }

          status=0
          run_tests "$first_log" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -q 'VITEST_BROWSER_CONNECTION_CLOSED' "$first_log" \
            && ! grep -Eq '(^|[[:space:]])FAIL[[:space:]]|Failed Tests|[0-9]+ failed' "$first_log"; then
            file=$(grep -o 'Failed to run the test [^ ]*' "$first_log" | head -n 1 || true)
            echo "::warning title=browser ($SHARD) re-run::The browser connection closed (VITEST_BROWSER_CONNECTION_CLOSED); running the shard once more. ${file}"
            {
              echo "### browser ($SHARD): re-run once"
              echo
              echo "The first run failed with \`VITEST_BROWSER_CONNECTION_CLOSED\` and no failed test (${file:-no file named}). Re-running the shard once; a second failure fails the job. See #582."
            } >> "$GITHUB_STEP_SUMMARY"

            status=0
            run_tests "$second_log" || status=$?
            {
              echo
              if [ "$status" -eq 0 ]; then
                echo "The re-run passed."
              else
                echo "The re-run failed (exit $status): treated as real."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - if: matrix.pw_unit == '1'
        env:
          FOLDKIT_PLAYWRIGHT_UNIT: '1'
        run: >-
          pnpm exec vitest run --project unit
          packages/mixins-data-grid/test/branded.test.ts
          packages/plus/test/playwright.test.ts

  # The site's prerender test builds every page, which took 10 minutes beside
  # other tests; it is in `buildTests`, so the shards leave it out.
  prerender:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOLDKIT_BUILDS: '1'
    steps:
      # The link check reads a post's links to a release tag in that tag's tree.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-workspace

      - run: pnpm exec vitest run --project unit examples/site/test/prerender.test.ts

  # PGlite's database collates by `C`, so a collation the Drizzle compiler
  # forgets to write passes every other test (expr-operations-DESIGN §17). These
  # run the conformance suite and the call orders on a Postgres in a locale; the
  # suite's first test fails if the database is not in one. The ledger's race
  # runs here too: PGlite runs one transaction at a time.
  postgres-locale:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_INITDB_ARGS: --locale=en_US.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - run: >-
          pnpm exec vitest run --project unit
          packages/remote-drizzle/test/conformance.test.ts
          packages/remote-drizzle/test/law.test.ts
          packages/remote-drizzle/test/orderCall.test.ts
          packages/remote-drizzle/test/ledgerRace.test.ts
          packages/remote-drizzle/test/storeRace.test.ts
          packages/remote-drizzle/test/restrictRace.test.ts
        env:
          FOLDKIT_LOCALE_PG: postgres://postgres:ci@localhost:5432/postgres

  # The examples with a server, end to end: each test starts the server and
  # Vite, and drives a real Chromium. `adoption` builds only the 19 pages it
  # opens (`FOLDKIT_SITE_ONLY`), and `scripts/e2e-shard.mjs` deals the rest
  # round-robin across 4 balanced shards instead of alphabetical slices.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: adoption, cmd: 'pnpm e2e examples/site/e2e/adoption.e2e.ts', adoption: '1' }
          - { name: 1/4, cmd: 'node scripts/e2e-shard.mjs 1 4', adoption: '' }
          - { name: 2/4, cmd: 'node scripts/e2e-shard.mjs 2 4', adoption: '' }
          - { name: 3/4, cmd: 'node scripts/e2e-shard.mjs 3 4', adoption: '' }
          - { name: 4/4, cmd: 'node scripts/e2e-shard.mjs 4 4', adoption: '' }
    env:
      FOLDKIT_ADOPTION: ${{ matrix.adoption }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/setup-playwright

      - run: ${{ matrix.cmd }}

  # Build, canonicalize, type-check published entry points, and pack every
  # package ONCE. Downstream wave-2 jobs (`pack`, `scaffold`, `demo`, `builds`,
  # `perf`) download these artifacts instead of rebuilding 43 packages each,
  # keeping wave-1 concurrency at <= 20 runners (zero queueing on GitHub Free).
  tarballs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Build, canonicalize, verify types, and pack packages
        run: |
          set -euo pipefail
          pnpm build:packages
          node -e "import('node:fs').then(async ({ readdirSync, existsSync }) => { const { canonicalizeDist } = await import('./scripts/bundle-report.mjs'); for (const d of readdirSync('packages')) { const dist = 'packages/' + d + '/dist'; if (existsSync(dist)) canonicalizeDist(dist); } })"
          node scripts/published-types.mjs
          pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          tar -cf packages-dist.tar packages/*/dist

      - uses: actions/upload-artifact@v7
        with:
          name: tarballs
          path: tarballs
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: packages-dist
          path: packages-dist.tar
          retention-days: 1
          if-no-files-found: error

  # The tests that make a production build of a page or a package
  # (`buildTests` in vitest.shared.ts), reusing prebuilt canonicalized `dist`.
  builds:
    needs: [changes, tarballs]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOLDKIT_BUILDS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - uses: actions/download-artifact@v8
        with:
          name: packages-dist

      - run: tar -xmf packages-dist.tar && rm -f packages-dist.tar

      - run: >-
          pnpm exec vitest run --project unit --maxWorkers=2
          test/bundle.test.ts auth/test/boot.test.ts auth/test/split.test.ts
          examples/cms/test/routes.test.ts
          .build.test.ts
          packages/mixins-ui/test/breadcrumbBuild.test.ts
          packages/mixins-ui/test/treeShaking.test.ts
          scripts/test/readOnlyPage.test.ts scripts/test/publishedBuild.test.ts

  # Every performance budget, on one quiet Linux runner, reusing prebuilt `dist`.
  perf:
    needs: [changes, tarballs]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOLDKIT_PERF: '1'
      PERF_REPORT: ${{ github.workspace }}/perf-report.jsonl
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - uses: actions/download-artifact@v8
        with:
          name: packages-dist

      - run: tar -xmf packages-dist.tar && rm -f packages-dist.tar

      # The layout-shift budget drives Chromium.
      - uses: ./.github/actions/setup-playwright

      - run: >-
          pnpm exec vitest run --project unit --no-file-parallelism
          examples/foldkit/domains-plus/test/cpu.test.ts
          examples/foldkit/domains-plus/test/bundle.test.ts
          examples/foldkit/domains-plus/test/serverBundle.test.ts
          examples/chirp/test/cpu.test.ts
          examples/cloudflare/test/cpu.test.ts
          examples/cloudflare/test/serverBundle.test.ts

      - run: pnpm exec vitest run --config vitest.e2e.config.ts examples/foldkit/domains-plus/e2e/layoutShift.e2e.ts
        if: ${{ !cancelled() }}

      # Read the exit status, not a pipe's: the table is written either way.
      - run: |
          status=0
          node scripts/perf-summary.mjs "$PERF_REPORT" > perf-summary.md || status=$?
          cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
        if: ${{ !cancelled() }}

  # Builds every example (except `examples/site`, covered by `prerender` and
  # `e2e (adoption)`) against the prebuilt `packages/*/dist` and runs all demos.
  demo:
    needs: [changes, tarballs]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - uses: actions/download-artifact@v8
        with:
          name: packages-dist

      - run: tar -xmf packages-dist.tar && rm -f packages-dist.tar

      - run: pnpm -r --filter "./examples/**" --filter "!foldkit-example-site" build && pnpm demo:run
        env:
          FOLDKIT_BUILD_ID: ci

  # Default published setup (ssr + npm, plus adapters and standalone/workspace
  # pnpm stand-ins) against the packed tarballs above.
  pack:
    needs: [changes, tarballs]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          install: 'false'
          cache: 'false'

      - uses: actions/download-artifact@v8
        with:
          name: tarballs
          path: tarballs

      - run: node scripts/published-setup.mjs "$GITHUB_WORKSPACE/tarballs"

  # The remaining rendering/manager scaffolds against the packed tarballs above.
  scaffold:
    needs: [changes, tarballs]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rendering: spa, manager: npm }
          - { rendering: ssg, manager: npm }
          - { rendering: ssr, manager: pnpm }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          install: 'false'
          cache: 'false'

      - uses: actions/download-artifact@v8
        with:
          name: tarballs
          path: tarballs

      - run: node scripts/published-setup.mjs --rendering ${{ matrix.rendering }} --manager ${{ matrix.manager }} "$GITHUB_WORKSPACE/tarballs"
