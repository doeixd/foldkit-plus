name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # tsdown needs Promise.withResolvers, so Node 22 is the floor. The version
      # is pinned in pnpm-workspace.yaml for local runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm paths:check

      - run: pnpm icons:check

      # Every branch on a `_tag` goes through a type the checker holds (AGENTS.md).
      - run: pnpm tags:check

      # No physical left/right in a style without a `// physical:` reason.
      - run: pnpm rtl:check

      # No `ModelRef`/`WritableProjection` write outside the packages that own
      # those seams without a `// write: infrastructure — <why>` reason.
      - run: pnpm writes:check

      # Every mutation spec still finds the code it edits; the mutations
      # themselves are too slow for CI, and a spec that rots runs nothing.
      - run: pnpm mutate:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Forced, so a warm `.tsbuild` cannot hide a project-graph change.
      - run: pnpm typecheck:force

      # The docs' TypeScript blocks, against what the step above just built,
      # so it takes seconds rather than a job of its own.
      - run: pnpm docs:check

  # Sharded: alone it took over ten minutes, the slowest job by four.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser binaries survive across runs; the install skips what the
      # cache already holds and fetches the rest, so a version bump stays correct.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # The browser tests (`*.browser.test.ts`) run in headless Chromium.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test --shard=${{ matrix.shard }}/4

  # PGlite's database collates by `C`, so a collation the Drizzle compiler
  # forgets to write passes every other test (expr-operations-DESIGN §17). These
  # run the conformance suite and the call orders on a Postgres in a locale; the
  # suite's first test fails if the database is not in one. The ledger's race
  # runs here too: PGlite runs one transaction at a time.
  postgres-locale:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_INITDB_ARGS: --locale=en_US.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: >-
          pnpm exec vitest run --project unit
          packages/remote-drizzle/test/conformance.test.ts
          packages/remote-drizzle/test/law.test.ts
          packages/remote-drizzle/test/orderCall.test.ts
          packages/remote-drizzle/test/ledgerRace.test.ts
        env:
          FOLDKIT_LOCALE_PG: postgres://postgres:ci@localhost:5432/postgres

  # The examples with a server, end to end: each test starts the server and
  # Vite, and drives a real Chromium.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

  # Every performance budget, on one quiet Linux runner: CPU readings step in
  # 15.6 ms on Windows and drift on a loaded shard, so the budget tests run
  # here and nowhere else on CI (`perfTests` in vitest.shared.ts). Files run
  # one at a time so one's build does not tax another's CPU. The CPU limits
  # stay generous because shared runners are noisy: they catch a route that
  # grew several times over. Each test writes its reading to PERF_REPORT; the
  # table lands in the job's summary, and a miss fails the job.
  perf:
    runs-on: ubuntu-latest
    env:
      FOLDKIT_PERF: '1'
      PERF_REPORT: ${{ github.workspace }}/perf-report.jsonl
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # The layout-shift budget drives Chromium; the bundle budgets build
      # against the packages' `dist` themselves (`scripts/bundle-report.mjs`).
      - run: pnpm exec playwright install --with-deps chromium

      - run: >-
          pnpm exec vitest run --project unit --no-file-parallelism
          examples/foldkit/domains-plus/test/cpu.test.ts
          examples/foldkit/domains-plus/test/bundle.test.ts
          examples/foldkit/domains-plus/test/serverBundle.test.ts
          examples/chirp/test/cpu.test.ts
          examples/cloudflare/test/cpu.test.ts
          examples/cloudflare/test/serverBundle.test.ts

      - run: pnpm exec vitest run --config vitest.e2e.config.ts examples/foldkit/domains-plus/e2e/layoutShift.e2e.ts
        if: ${{ !cancelled() }}

      # Read the exit status, not a pipe's: the table is written either way.
      - run: |
          status=0
          node scripts/perf-summary.mjs "$PERF_REPORT" > perf-summary.md || status=$?
          cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
        if: ${{ !cancelled() }}

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Also proves the example runs against the packages' published entry
      # points, which is how it imports them. Plain `tsx` traces: no browser.
      # The build id names no deployment; the SSG example's build refuses an
      # empty one, so CI names its own.
      - run: pnpm demo
        env:
          FOLDKIT_BUILD_ID: ci

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # And that every package still packs with those entry points, which is
      # what a release actually publishes. It builds the packages alone, as a
      # release does; `demo` builds the examples.
      - run: pnpm pack:check

  # The scaffolds `pack` does not make, each in a job of its own, since a
  # scaffold's install takes a minute: setup's printed scaffold command, its
  # install step, then the scaffold's own typecheck and lint, from the tarballs.
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rendering: spa, manager: npm }
          - { rendering: ssg, manager: npm }
          - { rendering: ssr, manager: pnpm }
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages && pnpm -r --filter "./packages/*" exec pnpm pack

      - run: node scripts/published-setup.mjs --rendering ${{ matrix.rendering }} --manager ${{ matrix.manager }}
