name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # tsdown needs Promise.withResolvers, so Node 22 is the floor. The version
      # is pinned in pnpm-workspace.yaml for local runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Each tsconfig's paths are derived from package exports, and every
      # workspace import is a referenced project, so none reads a stale build.
      - run: pnpm paths:check

      # Forced, so a warm `.tsbuild` cannot hide a project-graph change.
      - run: pnpm typecheck:force

      - run: pnpm test

      # Also proves the example runs against the packages' published entry
      # points, which is how it imports them.
      - run: pnpm demo

      # And that every package still packs with those entry points, which is
      # what a release actually publishes.
      - run: pnpm pack:check
