name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes its older run moot; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything but prose changed, for the jobs a document cannot break. A
  # job-level `if` rather than `paths-ignore`: a check that never runs blocks a
  # merge, a skipped one does not. Always true on main and for a pull request
  # that touches anything beyond Markdown, `docs/` and the licence. Not `skills/`
  # (it is shipped, and the `foldkit-plus` package tests read it).
  #
  # What a prose change still runs, because it reads the prose: `lint`, `typecheck`
  # (`docs:check` compiles the snippets in READMEs and `docs/`), `unit` (the guide
  # tests, `foldkit-plus`'s docs and skill tests, the README fixtures) and
  # `prerender` (the site builds its guides from them). Everything else is
  # skipped: browser tests, builds, e2e, perf, postgres, demo, pack and scaffolds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate               --jq '.[] | .filename, (.previous_filename // empty)')
            # An empty list is a failed read, not an empty change.
            if [ -n "$files" ]; then
              code=false
              while IFS= read -r file; do
                case "$file" in
                  skills/*) code=true ;;
                  *.md | docs/* | LICENSE) ;;
                  *) code=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # tsdown needs Promise.withResolvers, so Node 22 is the floor. The version
      # is pinned in pnpm-workspace.yaml for local runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm paths:check

      - run: pnpm icons:check

      # Every branch on a `_tag` goes through a type the checker holds (AGENTS.md).
      - run: pnpm tags:check

      # No physical left/right in a style without a `// physical:` reason.
      - run: pnpm rtl:check

      # No `ModelRef`/`WritableProjection` write outside the packages that own
      # those seams without a `// write: infrastructure — <why>` reason.
      - run: pnpm writes:check

      # Every mutation spec still finds the code it edits; the mutations
      # themselves are too slow for CI, and a spec that rots runs nothing.
      - run: pnpm mutate:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Forced, so a warm `.tsbuild` cannot hide a project-graph change.
      - run: pnpm typecheck:force

      # The docs' TypeScript blocks, against what the step above just built,
      # so it takes seconds rather than a job of its own.
      - run: pnpm docs:check

  # Sharded by project and by file count: alone it took over ten minutes, and
  # four shards of both projects together left the one that drew the site's
  # prerender at 13.5 minutes against 5 for the others (that test has a job of
  # its own now, `prerender`). The unit shards need no browser, so they skip
  # its install.
  unit:
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `foldkit-domains` is upstream's copy, happy-dom like the rest of these.
      - run: pnpm test --project unit --project foldkit-domains --shard=${{ matrix.shard }}/3

  # What jsdom cannot check: layout, focus, the caret, in headless Chromium. The
  # `browser-touch` project is a touch screen from the start and so a page of
  # its own, but it is eleven files and rides in the shards.
  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: browser (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser binaries survive across runs; the install skips what the
      # cache already holds and fetches the rest, so a version bump stays correct.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test --project browser --project browser-touch --shard=${{ matrix.shard }}/3

  # The site's prerender test builds every page, which took 10 minutes beside
  # other tests; it is in `buildTests`, so the shards leave it out.
  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOLDKIT_BUILDS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vitest run --project unit examples/site/test/prerender.test.ts

  # The tests that make a production build of a page or a package
  # (`buildTests` in vitest.shared.ts). In the shards they starved the runner
  # of memory until it lost contact with GitHub; here two at a time.
  builds:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOLDKIT_BUILDS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: >-
          pnpm exec vitest run --project unit --maxWorkers=2
          test/bundle.test.ts auth/test/boot.test.ts auth/test/split.test.ts
          scripts/test/readOnlyPage.test.ts scripts/test/publishedBuild.test.ts

  # PGlite's database collates by `C`, so a collation the Drizzle compiler
  # forgets to write passes every other test (expr-operations-DESIGN §17). These
  # run the conformance suite and the call orders on a Postgres in a locale; the
  # suite's first test fails if the database is not in one. The ledger's race
  # runs here too: PGlite runs one transaction at a time.
  postgres-locale:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_INITDB_ARGS: --locale=en_US.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: >-
          pnpm exec vitest run --project unit
          packages/remote-drizzle/test/conformance.test.ts
          packages/remote-drizzle/test/law.test.ts
          packages/remote-drizzle/test/orderCall.test.ts
          packages/remote-drizzle/test/ledgerRace.test.ts
        env:
          FOLDKIT_LOCALE_PG: postgres://postgres:ci@localhost:5432/postgres

  # The examples with a server, end to end: each test starts the server and
  # Vite, and drives a real Chromium. One job took 36 minutes with the files one
  # at a time, so the files are split: the site's adoption check, which builds
  # production and takes 8.6 minutes alone, gets a job of its own (the config
  # leaves it out of the others on CI), and Vitest's `--shard` splits the rest.
  # Within a job the files still run one at a time, since each starts servers.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: adoption, args: examples/site/e2e/adoption.e2e.ts, adoption: '1' }
          - { name: 1/4, args: --shard=1/4, adoption: '' }
          - { name: 2/4, args: --shard=2/4, adoption: '' }
          - { name: 3/4, args: --shard=3/4, adoption: '' }
          - { name: 4/4, args: --shard=4/4, adoption: '' }
    env:
      FOLDKIT_ADOPTION: ${{ matrix.adoption }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e ${{ matrix.args }}

  # Every performance budget, on one quiet Linux runner: CPU readings step in
  # 15.6 ms on Windows and drift on a loaded shard, so the budget tests run
  # here and nowhere else on CI (`perfTests` in vitest.shared.ts). Files run
  # one at a time so one's build does not tax another's CPU. The CPU limits
  # stay generous because shared runners are noisy: they catch a route that
  # grew several times over. Each test writes its reading to PERF_REPORT; the
  # table lands in the job's summary, and a miss fails the job.
  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOLDKIT_PERF: '1'
      PERF_REPORT: ${{ github.workspace }}/perf-report.jsonl
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # The layout-shift budget drives Chromium; the bundle budgets build
      # against the packages' `dist` themselves (`scripts/bundle-report.mjs`).
      - run: pnpm exec playwright install --with-deps chromium

      - run: >-
          pnpm exec vitest run --project unit --no-file-parallelism
          examples/foldkit/domains-plus/test/cpu.test.ts
          examples/foldkit/domains-plus/test/bundle.test.ts
          examples/foldkit/domains-plus/test/serverBundle.test.ts
          examples/chirp/test/cpu.test.ts
          examples/cloudflare/test/cpu.test.ts
          examples/cloudflare/test/serverBundle.test.ts

      - run: pnpm exec vitest run --config vitest.e2e.config.ts examples/foldkit/domains-plus/e2e/layoutShift.e2e.ts
        if: ${{ !cancelled() }}

      # Read the exit status, not a pipe's: the table is written either way.
      - run: |
          status=0
          node scripts/perf-summary.mjs "$PERF_REPORT" > perf-summary.md || status=$?
          cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
        if: ${{ !cancelled() }}

  demo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Also proves the example runs against the packages' published entry
      # points, which is how it imports them. Plain `tsx` traces: no browser.
      # The build id names no deployment; the SSG example's build refuses an
      # empty one, so CI names its own.
      - run: pnpm demo
        env:
          FOLDKIT_BUILD_ID: ci

  pack:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # And that every package still packs with those entry points, which is
      # what a release actually publishes. It builds the packages alone, as a
      # release does; `demo` builds the examples.
      - run: pnpm pack:check

  # The scaffolds `pack` does not make, each in a job of its own, since a
  # scaffold's install takes a minute: setup's printed scaffold command, its
  # install step, then the scaffold's own typecheck and lint, from the tarballs.
  scaffold:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rendering: spa, manager: npm }
          - { rendering: ssg, manager: npm }
          - { rendering: ssr, manager: pnpm }
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages && pnpm -r --filter "./packages/*" exec pnpm pack

      - run: node scripts/published-setup.mjs --rendering ${{ matrix.rendering }} --manager ${{ matrix.manager }}
