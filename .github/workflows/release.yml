name: Release

# Publishes every non-private package under `packages/*` to npm, and turns a
# version tag into a GitHub release. Push a version tag (`v0.1.0`) or run the
# workflow manually. Publishing needs the `NPM_TOKEN` repository secret; without
# it the publish step is skipped. A manual run publishes but makes no release:
# there is no tag to make one for. It then redeploys the website and the demos
# that changed (the `deploy` job), given the Cloudflare secrets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # `write` so the tag can be turned into a GitHub release; the publish step
  # itself needs nothing beyond the npm token.
  contents: write
  # Required for npm provenance, which the publish step opts into via
  # `NPM_CONFIG_PROVENANCE`.
  id-token: write

# Sourced once so the publish step can skip cleanly when the secret is absent;
# publishing without it would fail with a 401.
env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # No checks here: CI verifies the commit a tag goes on, in shards. This
      # job ran the whole suite again in one process, where the browser tests
      # lost their page and collided (v0.41.0, 2026-11-18), and so blocked a
      # release of a commit CI had passed. Tag only a commit whose CI run on
      # `main` is green. `pnpm release` still builds every package.

      # `pnpm release` builds, then publishes with `--access public`. pnpm
      # rewrites `workspace:^` peer ranges to real ranges as it packs, so it is
      # the only supported publisher here; `npm publish` would ship the
      # `workspace:` protocol verbatim.
      - name: Publish
        if: ${{ env.NPM_TOKEN != '' }}
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # A tag is what marks a release, so the notes come from the changelog
      # section that matches it: `v0.8.0` takes `## 0.8.0`. This runs whether or
      # not the publish above did — the tag exists either way, and the notes
      # describe the change rather than claiming what the registry now serves.
      #
      # A missing section fails the job on purpose. A release whose notes are
      # empty is worse than one that did not happen, and this is exactly the
      # mistake a version bump makes: the changelog heading and the tag drifting
      # apart.
      - name: GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## $version' section for tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          # GitHub refuses a release body over 125,000 characters (v0.41.0's
          # section was longer): then the notes are the section's summary, the
          # text before its first `### ` heading, and a link to the rest.
          if [ "$(wc -m < release-notes.md)" -gt 120000 ]; then
            awk '/^### / { exit } { print }' release-notes.md > summary.md
            printf '\nThe full list of changes is in [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> summary.md
            mv summary.md release-notes.md
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; updating notes."
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi

  # Check once whether Cloudflare deploy secrets exist so missing secrets warn
  # visibly instead of spinning up ten runners that quietly skip.
  deploy-check:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.secrets.outputs.enabled }}
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set — skipping all Cloudflare deploys."
            {
              echo "### Cloudflare deploys skipped"
              echo "Set both \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` repository secrets to enable automatic deploys on release."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  # The website and the demos, each only when it needs it: a target is
  # redeployed when its example, or a workspace package it depends on, changed
  # since the tag before this one (`pnpm --filter "...[<tag>]"` lists what
  # changed with everything that depends on it). A manual run deploys them all.
  # Needs the `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` secrets;
  # without them `deploy-check` warns and skips the matrix. `examples/cloudflare`
  # (a Worker with D1 migrations to read before applying) stays a manual deploy.
  deploy:
    needs: [publish, deploy-check]
    if: needs.deploy-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Four runners at once: each target builds on its own runner, so a full
      # release finishes in three waves instead of five.
      max-parallel: 4
      matrix:
        include:
          # The site also publishes the guides and every README, which no
          # package depends on.
          - {
              package: foldkit-example-site,
              script: build,
              dir: examples/site,
              out: dist,
              project: foldkit-plus,
              also: 'docs README.md CHANGELOG.md packages/*/README.md',
            }
          - {
              package: foldkit-example-cms,
              script: 'build:sandbox',
              dir: examples/cms,
              out: dist,
              project: foldkit-cms-demo,
            }
          - {
              package: foldkit-example-registry,
              script: 'build:sandbox',
              dir: examples/registry,
              out: dist,
              project: foldkit-registry-demo,
            }
          - {
              package: foldkit-example-todo-app,
              script: 'build:sandbox',
              dir: examples/todo-app,
              out: dist,
              project: foldkit-todo-demo,
            }
          - {
              package: foldkit-example-pages,
              script: 'build:sandbox',
              dir: examples/pages,
              out: dist,
              project: foldkit-pages-demo,
            }
          - {
              package: foldkit-example-data-grid,
              script: build,
              dir: examples/data-grid,
              out: dist,
              project: foldkit-grid-demo,
            }
          - {
              package: foldkit-example-richtext-playground,
              script: build,
              dir: examples/richtext-playground,
              out: dist,
              project: foldkit-richtext-demo,
            }
          - {
              package: foldkit-example-chirp,
              script: 'build:sandbox',
              dir: examples/chirp,
              out: dist,
              project: foldkit-chirp-demo,
            }
          - {
              package: foldkit-example-widgets,
              script: build,
              dir: examples/widgets,
              out: dist,
              project: foldkit-widgets-demo,
            }
          # A Worker, not a Pages project: its name and assets come from wrangler.jsonc.
          - {
              package: foldkit-example-foldkit-domains-plus,
              script: build,
              dir: examples/foldkit/domains-plus,
              worker: true,
            }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, to find the one before this.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Needed?
        id: needed
        env:
          ALSO: ${{ matrix.also }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "A manual run deploys every target." && echo "deploy=true" >> "$GITHUB_OUTPUT" && exit 0
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "No earlier tag: deploying." && echo "deploy=true" >> "$GITHUB_OUTPUT" && exit 0
          fi
          pnpm install --frozen-lockfile --ignore-scripts > /dev/null
          if pnpm --filter "...[$previous]" ls --depth -1 --parseable | grep -qx "$GITHUB_WORKSPACE/${{ matrix.dir }}"; then
            echo "${{ matrix.package }} or a package it uses changed since $previous." && echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$ALSO" ]; then
            set -f
            read -ra extra <<< "$ALSO"
            set +f
            if ! git diff --quiet "$previous" "$GITHUB_REF_NAME" -- "${extra[@]}"; then
              echo "A file ${{ matrix.package }} publishes changed since $previous." && echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "Nothing ${{ matrix.package }} is built from changed since $previous." && echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Nothing ${{ matrix.package }} is built from changed since $previous." && echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.needed.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      # The examples' configs read some packages' `dist` (`foldkit-ssr/vite`).
      - if: steps.needed.outputs.deploy == 'true'
        run: pnpm build:packages

      - name: Build
        if: steps.needed.outputs.deploy == 'true'
        run: pnpm --filter ${{ matrix.package }} run ${{ matrix.script }}
        env:
          FOLDKIT_BUILD_ID: ${{ github.sha }}

      # From the example's own folder: Wrangler refuses a workspace root, and
      # the site's `functions/` are read from where it runs.
      - name: Deploy to Pages
        if: steps.needed.outputs.deploy == 'true' && !matrix.worker
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx -y wrangler@4 pages deploy ${{ matrix.out }} --project-name ${{ matrix.project }} --branch main --commit-dirty=true; then
              echo "Deployed \`${{ matrix.package }}\` to Pages project \`${{ matrix.project }}\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::wrangler pages deploy attempt $attempt failed; retrying in 10s"
            sleep 10
          done

      - name: Deploy the Worker
        if: steps.needed.outputs.deploy == 'true' && matrix.worker
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx -y wrangler@4 deploy; then
              echo "Deployed Worker \`${{ matrix.package }}\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::wrangler deploy attempt $attempt failed; retrying in 10s"
            sleep 10
          done
