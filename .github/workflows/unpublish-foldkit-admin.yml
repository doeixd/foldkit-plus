# One-off: removes foldkit-admin@0.1.0 from npm. The package was renamed to
# foldkit-crud hours after its first publish, and nothing depends on it.
# Unpublishing is permanent, so this runs only by hand, only for that one
# version, and only when the confirmation is typed. Delete this file afterwards.
name: Unpublish foldkit-admin

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "foldkit-admin@0.1.0" to unpublish it for good
        required: true

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        if: ${{ inputs.confirm != 'foldkit-admin@0.1.0' }}
        run: |
          echo "Confirmation did not match; nothing was unpublished."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Unpublish
        run: npm unpublish foldkit-admin@0.1.0 --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm it is gone
        run: |
          if npm view foldkit-admin@0.1.0 version 2>/dev/null | grep -q .; then
            echo "foldkit-admin@0.1.0 is still served."
            exit 1
          fi
          echo "foldkit-admin@0.1.0 is no longer served."
