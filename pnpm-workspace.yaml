packages:
  - packages/*
  - examples/*
  - examples/foldkit/*

# tsdown requires Node 22+ (Promise.withResolvers). The version is pinned in
# pnpm-workspace.yaml for local runs; jsdom needs ^22.22.2 and
# @agent-native/core >=22.22.0, so the floor is the latest 22.x.
useNodeVersion: 22.23.4

# One copy of each Effect package keeps their services and types shared.
# Foldkit's peers and its Vite plugin's dependencies take `~4.1.0`; these hold
# the platform and SQLite packages at the Effect the workspace runs, as
# `foldkit-plus setup` does in an application (`effectPackages` in
# `packages/plus/src/setup.ts`).
overrides:
  '@effect/platform-browser': ^4.1.0
  '@effect/platform-node': ^4.1.0
  '@effect/platform-node-shared': ^4.1.0
  '@effect/sql-sqlite-node': ^4.1.0

# The upstream foldkit-domains copy (`examples/foldkit/domains`) pins
# Foldkit's Blocks preview canary and carries upstream's VirtualList patch.
patchedDependencies:
  '@foldkit/ui@0.169.0-canary.90746b32d2ca': examples/foldkit/domains/patches/@foldkit__ui@0.169.0-canary.90746b32d2ca.patch
  # Effect 4.1 moved `Crypto` to `effect/crypto`'s `SecureRandom`; the patch
  # makes the preview plugin's change that the released 0.29.0 made.
  '@foldkit/vite-plugin@0.28.0-canary.90746b32d2ca': examples/foldkit/domains/patches/@foldkit__vite-plugin@0.28.0-canary.90746b32d2ca.patch
