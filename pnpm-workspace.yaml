packages:
  - packages/*
  - examples/*
  - examples/foldkit/*

# tsdown requires Node 22+ (Promise.withResolvers). The version is pinned in
# pnpm-workspace.yaml for local runs; jsdom needs ^22.22.2 and
# @agent-native/core >=22.22.0, so the floor is the latest 22.x.
useNodeVersion: 22.23.4

# foldkit pins Effect exactly (a peer of effect@4.0.0, and its Vite plugin a
# dependency on @effect/platform-node@4.0.0); any 4.x satisfies them here, and one
# copy of each Effect package keeps their services and types shared.
overrides:
  '@effect/platform-browser': ^4.0.5
  '@effect/platform-node': ^4.0.5
  '@effect/platform-node-shared': ^4.0.5
  '@effect/sql-sqlite-node': ^4.0.5

peerDependencyRules:
  allowedVersions:
    effect: '4'
    '@effect/platform-browser': '4'
    '@effect/platform-node': '4'
