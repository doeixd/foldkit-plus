# The visitable site. The Durable Object class lives on the `foldkit-cloudflare`
# Worker; this project binds that Worker and forwards `/remote` and `/sync`.
name = "foldkit-crud"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[services]]
binding = "API"
service = "foldkit-cloudflare"

# The class is exported by the Worker above. Pages cannot define it.
[[durable_objects.bindings]]
name = "SYNC_HOST"
class_name = "SyncHost"
script_name = "foldkit-cloudflare"
