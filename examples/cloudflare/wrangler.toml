name = "foldkit-cloudflare"
# Produced by `pnpm --filter foldkit-example-cloudflare build:worker`.
# Already bundled the way the tests bundle it, source condition included.
main = "dist/worker.js"
no_bundle = true
# The local stack (`src/workers.ts`) reads this file, the date, the flags and
# every binding below, so a deploy runs what the tests ran. `nodejs_compat` is
# for Yielded's password hashing; `ReadableStream`'s constructor, which live
# streams use, is on by this date. The stack refuses a date newer than the
# installed workerd knows: move `wrangler` and `miniflare` together to raise it.
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

# Local runs (`pnpm dev`, `pnpm demo`, the tests) need no account.
# `database_id` is the D1 database behind the public demo. A fork creates its
# own with `wrangler d1 create foldkit-cloudflare` and replaces this id.
[[d1_databases]]
binding = "DB"
database_name = "foldkit-cloudflare"
database_id = "c1fabe99-8aab-498a-a88b-09dd5d0f4b00"
migrations_dir = "migrations"

# Originals by content hash, and the variants made of them (`variants/`).
# A fork creates its own with `wrangler r2 bucket create foldkit-media`.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "foldkit-media"

# Resizes `/_image/` variants. Needs Cloudflare Images on the account.
[images]
binding = "IMAGES"

# How many variants a client may have made a minute; a variant already made is
# served without asking.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[durable_objects.bindings]]
name = "SYNC_HOST"
class_name = "SyncHost"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncHost"]
