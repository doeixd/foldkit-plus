<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget showcase</title>
    <style>
      body {
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        max-width: 44rem;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }
      section {
        /* The theme's line, so it follows the scheme; the page draws before the sheet. */
        border-top: 1px solid var(--fk-outline-default, #e4e4e7);
        padding: 1.25rem 0;
      }
      /* A section not yet loaded still takes room, so those far down stay unloaded. */
      section > div:empty {
        min-height: 14rem;
      }
      h2 {
        font-size: 1rem;
        margin: 0 0 0.75rem;
      }
      /* A phone: the title and each section take less of the screen around what they hold. */
      @media (max-width: 40rem) {
        body {
          padding: 0.75rem 1rem 4rem;
        }
        h1 {
          font-size: 1.5rem;
          margin: 0 0 0.25rem;
        }
        p {
          margin: 0 0 0.5rem;
        }
        section {
          padding: 0.75rem 0;
        }
        h2 {
          margin-bottom: 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Widget showcase</h1>
    <p>
      Every widget below is live: one composed primitive set per island, no bespoke state machines.
    </p>
    <main id="showcase"></main>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
