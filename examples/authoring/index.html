<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authoring a UI from primitives</title>
    <style>
      body {
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        max-width: 44rem;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }
      section {
        border-top: 1px solid var(--fk-outline-default, #e4e4e7);
        padding: 1.25rem 0;
      }
      h2 {
        font-size: 1rem;
        margin: 0 0 0.75rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        align-items: start;
      }
    </style>
  </head>
  <body>
    <h1>Authoring a UI from primitives</h1>
    <p>
      Each section is assembled from primitives in this repository, with no widget from a library: a
      search field, an editable list, a popup, a sortable listbox and an editor an agent can save.
    </p>
    <main id="sections"></main>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
